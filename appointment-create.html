<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Appointment — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>New Appointment</h1>
                    <p class="subtitle">Schedule a new appointment for a patient</p>
                </div>
                <div class="page-actions">
                    <a href="appointments.html" class="btn btn-secondary"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span> Back to Appointments</a>
                </div>
            </div>

            <div class="form-container">
                <form id="appointment-form">
                    <div class="form-section">
                        <div class="form-section-title">Patient & Doctor</div>
                        <div class="form-grid form-grid-2">
                            <div class="form-group">
                                <label class="form-label required" for="patient-search-input">Patient</label>
                                <div class="searchable-select" id="patient-searchable-select">
                                    <div class="select-control" tabindex="0">
                                        <span class="select-value">Select Patient</span>
                                        <span class="select-arrow">▼</span>
                                    </div>
                                    <div class="select-dropdown">
                                        <input type="text" class="select-search" placeholder="Search patients...">
                                        <div class="select-options"></div>
                                    </div>
                                    <input type="hidden" id="patient-id">
                                </div>
                                <div class="form-error" id="patient-error"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label required" for="doctor">Doctor</label>
                                <select id="doctor" class="form-select" required>
                                    <option value="">Select Doctor</option>
                                </select>
                                <div class="form-error" id="doctor-error"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label required" for="department">Department</label>
                                <select id="department" class="form-select" required>
                                    <option value="">Select Department</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label required" for="appointment-type">Appointment Type</label>
                                <select id="appointment-type" class="form-select" required>
                                    <option value="consultation">Consultation</option>
                                    <option value="follow-up">Follow-up</option>
                                    <option value="emergency">Emergency</option>
                                    <option value="routine-checkup">Routine Checkup</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-section-title">Schedule</div>
                        <div class="form-grid form-grid-2">
                            <div class="form-group">
                                <label class="form-label required" for="appointment-date">Date</label>
                                <input type="date" id="appointment-date" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label required" for="appointment-time">Time</label>
                                <input type="time" id="appointment-time" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="duration">Duration (minutes)</label>
                                <input type="number" id="duration" class="form-input" value="30" min="5" max="120">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="priority">Priority</label>
                                <select id="priority" class="form-select">
                                    <option value="normal">Normal</option>
                                    <option value="urgent">Urgent</option>
                                    <option value="emergency">Emergency</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-section-title">Notes</div>
                        <div class="form-group">
                            <label class="form-label" for="notes">Additional Notes</label>
                            <textarea id="notes" class="form-textarea" placeholder="Enter any additional notes or special instructions..."></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <span class="btn-text">Create Appointment</span>
                            <span class="btn-loading" style="display: none;">Saving...</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/appointment-create.js"></script>
</body>
</html>
