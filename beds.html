<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beds — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
                        <div class="page-header">
                <div><h1>Beds</h1><p class="subtitle">Manage hospital beds and their status</p></div>
                <div class="page-actions">
                    <button class="btn btn-secondary" id="bulk-beds-btn" data-permission="BED_MANAGE" type="button">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18h.01"/><path d="M12 14h.01"/><path d="M12 10h.01"/></svg></span> Bulk Beds
                    </button>
                    <button class="btn btn-primary" id="add-bed-btn" data-permission="BED_ASSIGN">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Add Bed
                    </button>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-toolbar">
                        <div class="toolbar-left">
                            <select class="form-select" id="filter-ward" style="width: 180px;">
                                <option value="">All Wards</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <select class="form-select" id="filter-status" style="width: 140px;">
                                <option value="">All Statuses</option>
                                <option value="available">Available</option>
                                <option value="occupied">Occupied</option>
                                <option value="reserved">Reserved</option>
                                <option value="maintenance">Maintenance</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span>Bed List</span></div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="beds-table">
                            <thead>
                                <tr><th>Bed Number</th><th>Ward</th><th>Floor</th><th>Type</th><th>Status</th><th class="text-right">Actions</th></tr>
                            </thead>
                            <tbody id="beds-tbody">
                                <tr><td colspan="6"><div class="table-empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg></div><h3>Loading beds...</h3></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/beds.js"></script>
</body>
</html>
