﻿<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing & Checkout — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>Billing & Checkout</h1>
                    <p class="subtitle">Manage patient bills and process payments</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-outline" id="refresh-btn"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span> Refresh</button>
                </div>
            </div>

<div class="grid gap-4">
                <!-- Visits Ready for Billing -->
                <div class="card">
                    <div class="card-header">
                        <span>Visits Ready for Billing</span>
                        <span class="badge badge-secondary" id="visit-count">0 visits</span>
                    </div>
                    <div class="card-body">
                        <div class="table-container" style="max-height: 60vh; overflow-y: auto;">
                            <table class="table" id="billing-queue-table">
                                <thead>
                                    <tr>
                                        <th>Patient</th>
                                        <th>Visit ID</th>
                                        <th>Status</th>
                                        <th class="text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="billing-queue-tbody">
                                    <!-- Visits will be loaded here by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

<!-- Right Column: Checkout Details -->
                <div class="card" id="checkout-details-container" style="display: none; grid-column: 1 / -1;">
                    <div class="card-header">
                        <span>Patient Checkout</span>
                    </div>
                    <div class="card-body">
                        <div id="checkout-patient-info" class="mb-4">
                            <!-- Patient and visit info will be loaded here -->
                        </div>
                        
<div class="form-section">
                            <div class="form-section-title">Billable Services</div>
                            <div id="checkout-bill-to" class="mb-3">
                                <strong>Bill To:</strong> <span id="bill-to-name">—</span>
                            </div>
                            <div class="table-container">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Description</th>
                                            <th class="text-center">Qty</th>
                                            <th class="text-right">Unit Price</th>
                                            <th class="text-right">Amount</th>
                                            <th class="text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="bill-items-tbody">
                                        <!-- Bill items will be loaded here -->
                                    </tbody>
                                </table>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-outline btn-sm" id="add-bill-item-btn">
                                    <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Add Item
                                </button>
                            </div>
                        </div>

                        <div id="bill-summary" class="mt-4">
                            <!-- Bill summary (subtotal, total, etc.) will be loaded here -->
                        </div>

<div class="form-actions mt-4">
                            <button class="btn btn-secondary" id="save-bill-btn">
                                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span> Save Bill
                            </button>
                            <button class="btn btn-primary" id="record-payment-btn">
                                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span> Record Payment
                            </button>
                            <button class="btn btn-outline" id="print-invoice-btn">
                                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></span> Print Invoice
                            </button>
                            <button class="btn btn-success" id="checkout-btn" style="display: none;">
                                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Complete Checkout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/billing.js"></script>
</body>
</html>
