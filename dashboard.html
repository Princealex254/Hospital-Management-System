﻿<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Pre-loader -->
    <div id="pre-loader">
        <div class="spinner"></div>
    </div>

    <style>
        #pre-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--color-primary);
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            
            <!-- Page Content -->
            <div class="page-header">
                <div>
                    <h1>Dashboard</h1>
                    <p class="subtitle" id="dashboard-subtitle">Overview of your hospital operations</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-outline" id="refresh-dashboard">
                        <span class="icon-svg"></span> <span>Refresh</span>
                    </button>
                </div>
            </div>

            <!-- Stat Cards -->
            <div class="dashboard-stats" id="dashboard-stats">
                <!-- Stats are loaded dynamically by dashboard.js -->
            </div>

            <!-- Charts and Activity -->
            <div class="dashboard-charts">
                <!-- Revenue Chart -->
                <div class="card">
                    <div class="card-header" style="border-bottom: none;">
                        <span>Revenue (Last 7 Days)</span>
                    </div>
                    <div class="card-body">
                        <div class="chart-placeholder" id="revenue-chart">
                            Loading chart...
                        </div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header" style="border-bottom: none;">
                        <span>Recent Activity</span>
                    </div>
                    <div class="card-body">
                        <ul class="activity-list" id="activity-list">
                            <!-- Activity items are loaded dynamically -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card mt-4">
                <div class="card-header" style="border-bottom: none;">
                    <span>Quick Actions</span>
                </div>
                <div class="card-body">
                    <div class="quick-actions">
                        <a href="patient-register.html" class="quick-action-btn">
                            <div class="action-icon primary">👥</div>
                            <div class="action-label">Register Patient</div>
                        </a>
                        <a href="appointment-create.html" class="quick-action-btn">
                            <div class="action-icon info">📅</div>
                            <div class="action-label">New Appointment</div>
                        </a>
                        <a href="admission-create.html" class="quick-action-btn">
                            <div class="action-icon info">🏨</div>
                            <div class="action-label">New Admission</div>
                        </a>
                        <a href="consultation.html" class="quick-action-btn">
                            <div class="action-icon secondary">🩺</div>
                            <div class="action-label">Start Consultation</div>
                        </a>
                        <a href="pharmacy.html" class="quick-action-btn">
                            <div class="action-icon warning">💊</div>
                            <div class="action-label">Pharmacy</div>
                        </a>
                        <a href="lab-orders.html" class="quick-action-btn">
                            <div class="action-icon warning">🔬</div>
                            <div class="action-label">Lab Orders</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/icons.js"></script>    <style>
        /* ─── Dashboard Specific Styles ────────────────────────────────────────────── */

        /* Stat Cards */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .dashboard-stat-card {
            background: white;
            border-radius: var(--border-radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--color-gray-200);
            transition: all var(--transition-fast);
        }

        .dashboard-stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .dashboard-stat-card .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
        }

        .dashboard-stat-card .stat-icon .icon-svg {
            width: 24px;
            height: 24px;
        }

        /* Assign colors to stat cards */
        .dashboard-stat-card:nth-child(9n+1) .stat-icon { background-color: var(--color-primary); }
        .dashboard-stat-card:nth-child(9n+2) .stat-icon { background-color: var(--color-info); }
        .dashboard-stat-card:nth-child(9n+3) .stat-icon { background-color: var(--color-secondary); }
        .dashboard-stat-card:nth-child(9n+4) .stat-icon { background-color: var(--color-success); }
        .dashboard-stat-card:nth-child(9n+5) .stat-icon { background-color: var(--color-warning); }
        .dashboard-stat-card:nth-child(9n+6) .stat-icon { background-color: #6d28d9; } /* Deeper purple */
        .dashboard-stat-card:nth-child(9n+7) .stat-icon { background-color: var(--color-success-dark); }
        .dashboard-stat-card:nth-child(9n+8) .stat-icon { background-color: var(--color-error); }
        .dashboard-stat-card:nth-child(9n+9) .stat-icon { background-color: var(--color-error-dark); }

        .dashboard-stat-card .stat-content {
            flex: 1;
        }

        .dashboard-stat-card .stat-value {
            font-size: 1.75rem;
            font-weight: var(--font-weight-bold);
            color: var(--color-gray-900);
            line-height: 1;
        }

        .dashboard-stat-card .stat-label {
            font-size: var(--font-size-sm);
            color: var(--color-gray-500);
            margin-top: 4px;
        }

        /* Charts and Activity */
        .dashboard-charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 992px) {
            .dashboard-charts {
                grid-template-columns: 1fr;
            }
        }

        /* Simple Bar Chart */
        .bar-chart {
            height: 250px;
            width: 100%;
        }
        .bar-chart-grid {
            display: flex;
            justify-content: space-around;
            height: 100%;
            border-left: 1px solid var(--color-gray-200);
            border-bottom: 1px solid var(--color-gray-200);
            padding-top: 20px;
        }
        .bar-item {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            flex: 1;
            padding: 0 8px;
        }
        .bar {
            width: 70%;
            max-width: 40px;
            background: linear-gradient(to top, var(--color-primary-light), var(--color-primary));
            border-radius: 4px 4px 0 0;
            transition: height var(--transition-normal);
        }
        .bar-value {
            font-size: var(--font-size-xs);
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 4px;
        }
        .bar-label {
            font-size: var(--font-size-xs);
            color: var(--color-gray-500);
            margin-top: 8px;
            white-space: nowrap;
        }

        /* Recent Activity */
        .activity-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }
        .activity-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--color-gray-100);
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--color-gray-100);
            color: var(--color-gray-600);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .activity-content { flex: 1; }
        .activity-title { font-weight: 500; color: var(--color-gray-800); font-size: var(--font-size-sm); }
        .activity-desc { font-size: var(--font-size-xs); color: var(--color-gray-500); }
        .activity-time { font-size: var(--font-size-xs); color: var(--color-gray-400); white-space: nowrap; }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
        }
        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            border-radius: var(--border-radius);
            background-color: var(--color-gray-50);
            border: 1px solid var(--color-gray-200);
            text-decoration: none;
            color: var(--color-gray-700);
            transition: all var(--transition-fast);
        }
        .quick-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-primary-200);
            color: var(--color-primary);
        }
        .quick-action-btn .action-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .quick-action-btn .action-label {
            font-size: var(--font-size-sm);
            font-weight: 500;
            text-align: center;
        }
    </style>
</body>
</html>
