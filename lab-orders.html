<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Orders — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>Lab Orders</h1>
                    <p class="subtitle">Manage incoming laboratory test orders</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-outline" id="refresh-btn"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span> Refresh</button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-toolbar">
                        <div class="toolbar-left">
                            <div class="search-box">
                                <span class="icon-placeholder search-icon" data-icon="search"></span>
                                <input type="text" id="order-search" placeholder="Search by patient or test...">
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <select class="form-select" id="filter-status" style="width: 180px;">
                                <option value="">All Statuses</option>
                                <option value="ordered">Ordered</option>
                                <option value="sample-collected">Sample Collected</option>
                                <option value="in-progress">In Progress</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>Pending & Recent Orders</span>
                    <span class="badge badge-secondary" id="order-count">0 orders</span>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="lab-orders-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Patient</th>
                                    <th>Test Name</th>
                                    <th>Ordered By</th>
                                    <th>Status</th>
                                    <th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="lab-orders-tbody">
                                <!-- Orders will be loaded here by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/lab-orders.js"></script>
</body>
</html>
