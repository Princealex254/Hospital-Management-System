<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>OPD Management</h1>
                    <p class="subtitle">Out-patient department check-in and management</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-outline" id="refresh-opd"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span> Refresh</button>
                </div>
            </div>

            <!-- Check-in Section -->
            <div class="card mb-4">
                <div class="card-header">
                    <span>Check-in Patient</span>
                </div>
                <div class="card-body">
                    <div class="form-grid form-grid-2">
                        <div class="form-group" id="checkin-patient-select-container">
                            <label class="form-label required" for="checkin-patient-search">Patient</label>
                            <div class="select-container">
                                <div class="select-control"><span class="select-value placeholder">Select Patient</span></div>
                                <div class="select-options">
                                    <input type="text" class="select-search" id="checkin-patient-search" placeholder="Search patient...">
                                    <div class="options-list"></div>
                                </div>
                            </div>
                            <input type="hidden" id="checkin-patient-id">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="checkin-doctor">Doctor</label>
                            <select id="checkin-doctor" class="form-select">
                                <option value="">Select Doctor</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row mt-3">
                        <div class="form-group">
                            <button class="btn btn-success" id="checkin-btn">
                                <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Check In Patient
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Today's OPD Patients -->
            <div class="card">
                <div class="card-header">
                    <span>Today's OPD Patients</span>
                    <span class="text-muted" id="opd-count">0 patients</span>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="opd-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Patient</th>
                                    <th>Doctor</th>
                                    <th>Check-in Time</th>
                                    <th>Status</th>
                                    <th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="opd-tbody">
                                <tr><td colspan="6"><div class="table-empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg></div><h3>Loading OPD patients...</h3></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Custom Searchable Dropdown for OPD Check-in */
        #checkin-patient-select-container .select-container {
            position: relative;
        }
        #checkin-patient-select-container .select-control {
            background: white;
            border: 1px solid var(--color-gray-300);
            border-radius: var(--border-radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color var(--transition-fast);
        }
        #checkin-patient-select-container .select-control:hover {
            border-color: var(--color-gray-400);
        }
        #checkin-patient-select-container .select-container.open .select-control {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-100);
        }
        #checkin-patient-select-container .select-value.placeholder {
            color: var(--color-gray-500);
        }
        #checkin-patient-select-container .select-options {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--color-gray-300);
            border-top: none;
            border-radius: 0 0 var(--border-radius-sm) var(--border-radius-sm);
            box-shadow: var(--shadow-lg);
            max-height: 250px;
            overflow-y: auto;
            z-index: 1050;
            margin-top: 4px;
        }
        #checkin-patient-select-container .select-container.open .select-options {
            display: block;
        }
        #checkin-patient-select-container .select-search {
            width: 100%; padding: 10px 12px; border: none; border-bottom: 1px solid var(--color-gray-200); outline: none;
        }
        #checkin-patient-select-container .select-option {
            padding: 10px 12px; cursor: pointer; transition: background-color var(--transition-fast);
        }
        #checkin-patient-select-container .select-option:hover {
            background-color: var(--color-primary-50);
        }
    </style>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/opd.js"></script>
</body>
</html>
