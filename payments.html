<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
                        <div class="page-header">
                <div><h1>Payments</h1><p class="subtitle">Record and manage patient payments</p></div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="record-payment-btn" data-permission="PAYMENT_CREATE">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Record Payment
                    </button>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-toolbar">
                        <div class="toolbar-left">
                            <div class="search-box">
                                <input type="text" id="payment-search" placeholder="Search by patient or reference...">
                                <button class="search-btn" id="search-btn"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span></button>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <select class="form-select" id="filter-method" style="width: 140px;">
                                <option value="">All Methods</option>
                                <option value="cash">Cash</option>
                                <option value="mpesa">M-Pesa</option>
                                <option value="card">Card</option>
                                <option value="insurance">Insurance</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span>Payment Records</span><span class="text-muted" id="payment-count">0 payments</span></div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="payments-table">
                            <thead>
                                <tr><th>Date</th><th>Patient</th><th>Invoice #</th><th>Amount</th><th>Method</th><th>Reference</th><th class="text-right">Actions</th></tr>
                            </thead>
                            <tbody id="payments-tbody">
                                <tr><td colspan="7"><div class="table-empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div><h3>Loading payments...</h3></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <style>
        /* Custom Searchable Dropdown for Payment Modal */
        #payment-patient-select-container .select-container {
            position: relative;
        }
        #payment-patient-select-container .select-control {
            background: white;
            border: 1px solid var(--color-gray-300);
            border-radius: var(--border-radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color var(--transition-fast);
        }
        #payment-patient-select-container .select-control:hover {
            border-color: var(--color-gray-400);
        }
        #payment-patient-select-container .select-container.open .select-control {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-100);
        }
        #payment-patient-select-container .select-value.placeholder {
            color: var(--color-gray-500);
        }
        #payment-patient-select-container .select-options {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--color-gray-300);
            border-top: none;
            border-radius: 0 0 var(--border-radius-sm) var(--border-radius-sm);
            box-shadow: var(--shadow-lg);
            max-height: 250px;
            overflow-y: auto;
            z-index: 1050; /* Above modal content */
            margin-top: 4px;
        }
        #payment-patient-select-container .select-container.open .select-options {
            display: block;
        }
        #payment-patient-select-container .select-search {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-bottom: 1px solid var(--color-gray-200);
            outline: none;
        }
        #payment-patient-select-container .select-option {
            padding: 10px 12px;
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }
        #payment-patient-select-container .select-option:hover {
            background-color: var(--color-primary-50);
        }
    </style>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/payments.js"></script>
</body>
</html>
