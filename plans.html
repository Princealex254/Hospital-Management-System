<body>

        <div class="main-content">

                </div>
            </div>
            <div class="card">
                <div class="card-header"><span>Plan List</span><span class="text-muted" id="plan-count">0 plans</span></div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="plans-table">
                            <thead>
                                <tr><th>Name</th><th>Price</th><th>Duration</th><th>Features</th><th>Status</th><th class="text-right">Actions</th></tr>
                            </thead>
                            <tbody id="plans-tbody">
