<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>Queue Management</h1>
                    <p class="subtitle">View and manage the patient queue</p>
                </div>
                <div class="page-actions">
<button type="button" class="btn btn-outline" id="refresh-queue"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span> Refresh</button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-toolbar">
                        <div class="toolbar-left">
                            <select class="form-select" id="filter-doctor" style="width: 180px;">
                                <option value="">All Doctors</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <span class="badge badge-info" id="queue-count">0 in queue</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>Current Queue</span>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="queue-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Patient</th>
                                    <th>Doctor</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                    <th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="queue-tbody">
                                <tr><td colspan="6"><div class="table-empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><h3>Loading queue...</h3></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/queue.js"></script>
</body>
</html>
