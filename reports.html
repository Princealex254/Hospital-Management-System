<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
                        <div class="page-header">
                <div><h1>Reports</h1><p class="subtitle">Generate and view hospital reports</p></div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="generate-report-btn" data-permission="REPORT_VIEW">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span> Generate Report
                    </button>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-toolbar">
                        <div class="toolbar-left">
                            <select class="form-select" id="report-type" style="width: 180px;">
                                <option value="patients">Patients</option>
                                <option value="appointments">Appointments</option>
                                <option value="admissions">Admissions</option>
                                <option value="discharges">Discharges</option>
                                <option value="revenue">Revenue</option>
                                <option value="payments">Payments</option>
                                <option value="pharmacy">Pharmacy</option>
                                <option value="laboratory">Laboratory</option>
                                <option value="inventory">Inventory</option>
                                <option value="insurance">Insurance</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <select class="form-select" id="report-period" style="width: 140px;">
                                <option value="today">Today</option>
                                <option value="week">This Week</option>
                                <option value="month">This Month</option>
                                <option value="custom">Custom Range</option>
                            </select>
                            <input type="date" id="report-start" class="form-input" style="width: 140px; display: none;">
                            <input type="date" id="report-end" class="form-input" style="width: 140px; display: none;">
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span>Report Results</span><span class="text-muted" id="report-count">0 records</span></div>
                <div class="card-body">
                    <div class="table-container" id="report-results">
                        <div class="table-empty">
                            <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></div>
                            <h3>Select a report type to generate results</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/reports.js"></script>
</body>
</html>
