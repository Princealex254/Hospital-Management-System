<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Movements — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
                        <div class="page-header">
                <div><h1>Stock Movements</h1><p class="subtitle">Track inventory stock movements</p></div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="record-movement-btn" data-permission="INVENTORY_UPDATE">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Record Movement
                    </button>
                    <a href="inventory.html" class="btn btn-outline"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><line x1="12" y1="13" x2="12" y2="21"/></svg> Inventory</a>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-body">
                    <div class="table-toolbar">
                        <div class="toolbar-left">
                            <div class="search-box">
                                <input type="text" id="movement-search" placeholder="Search by item or reference...">
                                <button class="search-btn" id="search-btn"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span></button>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <select class="form-select" id="filter-type" style="width: 140px;">
                                <option value="">All Types</option>
                                <option value="stock-in">Stock In</option>
                                <option value="stock-out">Stock Out</option>
                                <option value="transfer">Transfer</option>
                                <option value="adjustment">Adjustment</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span>Movement Records</span><span class="text-muted" id="movement-count">0 movements</span></div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="movements-table">
                            <thead>
                                <tr><th>Date</th><th>Item</th><th>Type</th><th>Quantity</th><th>Reference</th><th>Notes</th></tr>
                            </thead>
                            <tbody id="movements-tbody">
                                <tr><td colspan="6"><div class="table-empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><line x1="12" y1="13" x2="12" y2="21"/></svg></div><h3>Loading movements...</h3></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/stock-movements.js"></script>
</body>
</html>
