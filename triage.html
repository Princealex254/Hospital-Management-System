<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triage — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>Patient Triage</h1>
                    <p class="subtitle" id="triage-subtitle">Loading patient information...</p>
                </div>
                <div class="page-actions">
                    <a href="queue.html" class="btn btn-secondary"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span> Back to Queue</a>
                </div>
            </div>

            <div class="form-container">
                <form id="triage-form">
                    <!-- Vitals Section -->
                    <div class="form-section">
                        <div class="form-section-title">Vital Signs</div>
                        <div class="form-grid form-grid-4">
                            <div class="form-group">
                                <label class="form-label" for="temperature">Temperature (°C)</label>
                                <input type="number" step="0.1" id="temperature" class="form-input" placeholder="e.g. 36.5">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="heart-rate">Heart Rate (bpm)</label>
                                <input type="number" id="heart-rate" class="form-input" placeholder="e.g. 72">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="respiratory-rate">Resp. Rate (bpm)</label>
                                <input type="number" id="respiratory-rate" class="form-input" placeholder="e.g. 16">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="oxygen-saturation">O₂ Saturation (%)</label>
                                <input type="number" id="oxygen-saturation" class="form-input" placeholder="e.g. 98">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="bp-systolic">BP Systolic (mmHg)</label>
                                <input type="number" id="bp-systolic" class="form-input" placeholder="e.g. 120">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="bp-diastolic">BP Diastolic (mmHg)</label>
                                <input type="number" id="bp-diastolic" class="form-input" placeholder="e.g. 80">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="weight">Weight (kg)</label>
                                <input type="number" step="0.1" id="weight" class="form-input" placeholder="e.g. 70.5">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="height">Height (cm)</label>
                                <input type="number" id="height" class="form-input" placeholder="e.g. 175">
                            </div>
                        </div>
                    </div>

                    <!-- Complaint and Notes Section -->
                    <div class="form-section">
                        <div class="form-section-title">Clinical Assessment</div>
                        <div class="form-grid form-grid-1">
                            <div class="form-group">
                                <label class="form-label required" for="chief-complaint">Chief Complaint</label>
                                <textarea id="chief-complaint" class="form-textarea" rows="3" placeholder="Describe the patient's main reason for the visit..." required></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="nursing-notes">Nursing Notes</label>
                                <textarea id="nursing-notes" class="form-textarea" rows="3" placeholder="Add any relevant nursing observations..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Priority and Actions -->
                    <div class="form-section">
                        <div class="form-section-title">Triage Priority</div>
                        <div class="form-grid form-grid-2">
                            <div class="form-group">
                                <label class="form-label required" for="priority">Set Priority</label>
                                <select id="priority" class="form-select" required>
                                    <option value="Routine">Routine</option>
                                    <option value="Urgent">Urgent</option>
                                    <option value="High Priority">High Priority</option>
                                    <option value="Emergency">Emergency</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="pain-score">Pain Score (0-10)</label>
                                <input type="number" id="pain-score" class="form-input" min="0" max="10" placeholder="e.g. 5">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='queue.html'">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <span class="btn-text">Complete Triage</span>
                            <span class="btn-loading" style="display: none;">Saving...</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/triage.js"></script>
</body>
</html>
