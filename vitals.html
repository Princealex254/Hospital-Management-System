<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitals — PRINCE ALEX DIGITAL HMS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        <div class="main-content">
            
            <div class="page-header">
                <div>
                    <h1>Vitals Recording</h1>
                    <p class="subtitle">Record and view patient vital signs</p>
                </div>
                <div class="page-actions">
                    <a href="opd.html" class="btn btn-secondary"><span><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span> Back to OPD</a>
                </div>
            </div>

            <!-- Vitals Recording Form -->
            <div class="card mb-4">
                <div class="card-header">
                    <span>Record Vitals</span>
                </div>
                <div class="card-body">
                    <form id="vitals-form">
                        <input type="hidden" id="vitals-patient-id">

                        <div class="form-grid form-grid-2">
                            <div class="form-group">
                                <label class="form-label required" for="vitals-patient-search">Patient</label>
                                <input type="text" id="vitals-patient-search" class="form-input" placeholder="Search patient..." required>
                            </div>
                            <div class="form-group">
                                <label class="form-label required" for="vitals-recorded-by">Recorded By</label>
                                <input type="text" id="vitals-recorded-by" class="form-input" placeholder="Your name" required>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">Vital Signs</div>
                            <div class="form-grid form-grid-3">
                                <div class="form-group">
                                    <label class="form-label" for="bp-systolic">BP Systolic (mmHg)</label>
                                    <input type="number" id="bp-systolic" class="form-input" placeholder="120">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="bp-diastolic">BP Diastolic (mmHg)</label>
                                    <input type="number" id="bp-diastolic" class="form-input" placeholder="80">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="heart-rate">Heart Rate (bpm)</label>
                                    <input type="number" id="heart-rate" class="form-input" placeholder="72">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="temperature">Temperature (°C)</label>
                                    <input type="number" id="temperature" class="form-input" step="0.1" placeholder="36.5">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="respiratory-rate">Respiratory Rate</label>
                                    <input type="number" id="respiratory-rate" class="form-input" placeholder="16">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="oxygen-saturation">O₂ Saturation (%)</label>
                                    <input type="number" id="oxygen-saturation" class="form-input" placeholder="98">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="height">Height (cm)</label>
                                    <input type="number" id="height" class="form-input" placeholder="170">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="weight">Weight (kg)</label>
                                    <input type="number" id="weight" class="form-input" step="0.1" placeholder="70">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="bmi">BMI</label>
                                    <input type="number" id="bmi" class="form-input" step="0.1" placeholder="24.2" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="vitals-notes">Notes</label>
                            <textarea id="vitals-notes" class="form-textarea" placeholder="Any additional notes..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="submit-btn">
                                <span class="btn-text">Save Vitals</span>
                                <span class="btn-loading" style="display: none;">Saving...</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Recent Vitals History -->
            <div class="card">
                <div class="card-header">
                    <span>Recent Vitals</span>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="vitals-history-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Patient</th>
                                    <th>BP (mmHg)</th>
                                    <th>HR</th>
                                    <th>Temp</th>
                                    <th>Height</th>
                                    <th>Weight</th>
                                    <th>Recorded By</th>
                                </tr>
                            </thead>
                            <tbody id="vitals-history-tbody">
                                <tr><td colspan="8"><div class="table-empty"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><h3>Loading vitals history...</h3></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/debug.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script type="module" src="js/permissions.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/vitals.js"></script>
</body>
</html>
